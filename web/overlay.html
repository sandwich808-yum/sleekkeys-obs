<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SleekKeys Overlay</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="overlay">
  <div id="root"></div>
  <script src="/core.js"></script>
  <script>
    // The OBS Browser Source URL is always just  http://127.0.0.1:7878/overlay
    // Everything else (layout, theme, ...) comes from the editor and applies live - no URL changes needed.
    // Optional:  /overlay?profile=Name  shows a specific profile (use different looks on different scenes).
    const SK = window.SleekKeys;
    const root = document.getElementById('root');
    const q = new URLSearchParams(location.search);
    const preview = q.get('preview') === '1';        // inside the editor: fed by postMessage, not by the saved config
    const fitOn = q.get('fit') === '1';
    let ctrl = null, link = null, demoRun = null, current = null, wantDemo = false;
    document.body.classList.toggle('center', q.get('align') === 'center');

    function fit() {
      if (!ctrl) return;
      let s = 1;
      if (fitOn) s = Math.min(1, (innerWidth - 24) / (ctrl.size.w + 28), (innerHeight - 24) / (ctrl.size.h + 28));
      root.style.transform = s < 1 ? `scale(${s})` : '';
    }
    addEventListener('resize', fit);

    function background(o) {
      document.body.style.background = o.bg === 'green' ? '#00ff00' : (o.bg === 'transparent' ? 'transparent' : o.bg);
    }

    function show(profile) {
      const p = SK.normalizeProfile(profile);
      const same = current && JSON.stringify(current) === JSON.stringify(p);
      current = p;
      if (same && !wantDemo === !demoRun) return;
      if (link) link.close();
      if (demoRun) { demoRun.stop(); demoRun = null; }
      if (ctrl) ctrl.destroy();
      background(p.opts);
      ctrl = SK.mount(root, p.opts, p.layout);
      fit();
      link = SK.connect(ctrl, {
        status: (ok) => parent !== window && parent.postMessage({ type: 'status', ok }, location.origin),
        config: () => { if (!preview) load(); },
      });
      if (wantDemo) demoRun = SK.demo(ctrl);
      if (parent !== window) parent.postMessage({ type: 'size', w: ctrl.size.w, h: ctrl.size.h }, location.origin);
    }

    async function load() {
      let cfg = null;
      try { cfg = await (await fetch('/api/config', { cache: 'no-store' })).json(); } catch (_) {}
      cfg = SK.normalizeConfig(cfg);
      const name = q.get('profile');
      show(cfg.profiles[name] || cfg.profiles[cfg.active]);
    }

    if (preview) {
      addEventListener('message', (e) => {
        if (e.origin !== location.origin || !e.data || e.data.type !== 'profile') return;
        wantDemo = !!e.data.demo;
        show(e.data.profile);
      });
      parent !== window && parent.postMessage({ type: 'ready' }, location.origin);
    } else {
      load();
      setInterval(() => { if (!link) load(); }, 5000);   // recover if the app was restarted
    }
  </script>
</body>
</html>
